function updateEnemy(e,dt){

  switch(e.st){

    case 'atk':eAtk(e,dt);break;
    case 'block':
      e.vx*=Math.exp(-12*dt);e.face=sgn(player.x-e.x)||e.face;
      if(e.ctrQ>0&&e.t>.12){e.ctrQ=0;e.queue=[];startEAtk(e,e.variant>=2?'c_ctr':'b_ctr');break}
      if(e.t>=e.dur){e.st='loco';e.t=0}

    case 'edodge':

      break;
    case 'down':
      if(e.onG&&!e.landed){e.landed=true;e.lieT=0;dust(e.x,GY-3,5);SFX.down();trauma=Math.min(.7,trauma+.06)}
      if(e.onG){e.vx*=Math.exp(-7*dt);if(e.landed&&Math.abs(e.vx)<40){e.lieT+=dt;if(e.lieT>.85){e.st='getup';e.t=0}}}

          if(o.hp<=0)die(o,d,350);else setReact(o,'k',d,380,false);

        const g=registerHit('T',60);feed.push({s:'THROW',pts:g,t:1.6});

function maxAtk(){return hasBoss?1:(wave>=3?3:wave>=2?2:1)}
const AIP={basic:{slot:[150,225],press:[2.2,4]},aggr:{slot:[105,165],press:[1,2.2]},caut:{slot:[185,255],press:[3,5]},brute:{slot:[125,185],press:[1.6,3]},rusher:{slot:[190,270],press:[1.2,2.6]}};
/* crowd AI: IDLE -> DETECT -> APPROACH -> POSITION -> (CLOSE -> ATTACK) -> RECOVER -> REPOSITION */
function crowd(e,dt,dist,dp,spd,rng,canAtk){
  const P=player,prm=AIP[e.type]||AIP.basic;
  if(!e.slot){e.slot=rnd(prm.slot[0],prm.slot[1]);e.pressT=rnd(prm.press[0],prm.press[1]);e.aiS='idle';e.reactT=rnd(.15,.5)}
  if(e.aiS==='idle'){e.vx*=Math.exp(-10*dt);e.reactT-=dt;if(e.reactT<=0)e.aiS='approach';return}
  if(e.aiS==='recover')e.aiS='reposition';
  const side=-dp;let rank=0;
  for(let i=0;i<enemies.length;i++){const o=enemies[i];if(o===e||o.dead)continue;if(sgn(o.x-P.x)===side&&Math.abs(o.x-P.x)<dist-10)rank++}
  const slotEff=e.slot+Math.min(rank,3)*58,closing=P.vx*dp;
  if(e.aiS!=='close'){
    if(closing>260&&dist<220){steer(e,-dp,spd*.9,dt);return}
    if(closing<-240&&dist<420&&dist>slotEff){steer(e,dp,spd*1.4,dt);return}
  }
  if(e.type==='caut'&&e.aiS!=='close'){
    const opening=(P.st==='atk'&&!P.connected&&P.t>P.atk.wind+P.atk.act&&P.atk.reach>0)||P.st==='land'||P.st==='throw'||P.st==='slam'||(P.st==='grab'&&!P.gTarget)||(P.st==='dodge'&&P.t>.3);
    if(opening&&canAtk&&dist<340&&atkNow+closeNow<maxAtk()){e.aiS='close';e.closeT=0}
  }
  if(e.aiS==='approach'){
    if(dist>slotEff+30)steer(e,dp,spd,dt);else e.aiS='position';
    return;
  }
  if(e.aiS==='position'||e.aiS==='reposition'){
    const want=slotEff+Math.sin(gt*1.6+e.seed)*(e.aiS==='reposition'?10:26);
    if(dist>want+10)steer(e,dp,spd*(dist>slotEff+120?1:.55),dt);
    else if(dist<want-10)steer(e,-dp,spd*.5,dt);
    else e.vx*=Math.exp(-9*dt);
    if(dist>slotEff+110)e.aiS='approach';
    if(e.aiS==='reposition'){e.repoT-=dt;if(e.repoT<=0)e.aiS='position'}
    if(e.flankT<=0&&e.onG&&dist>110&&dist<290){e.flankT=rnd(3,6);if(sideCount(side)>sideCount(-side)){e.vy=-770;e.vx=dp*540;e.onG=false;return}}
    if(e.type==='rusher'){e.pressT-=dt;if(e.pressT<=0&&canAtk&&dist<340&&dist>90){decideAttack(e,dist);return}}
    else{e.pressT-=dt*(e.role==='engage'?2.2:1);if(e.pressT<=0&&e.cool<=0&&atkNow+closeNow<maxAtk()){e.aiS='close';e.closeT=0}}
    return;
  }
  e.closeT+=dt;
  if(dist>rng+6)steer(e,dp,spd*(dist>260?1.5:1.05),dt);else e.vx*=Math.exp(-10*dt);
  if(dist<50)steer(e,-dp,spd*.7,dt);
  if(dist<=rng+10&&e.cool<=0&&atkNow<maxAtk()){decideAttack(e,dist);return}
  if(e.closeT>3.2){e.aiS='reposition';e.repoT=.6;e.pressT=rnd(prm.press[0],prm.press[1])}
}

function director(dt){
  dirc.t-=dt;if(dirc.t>0)return;dirc.t=Math.random()*.5+.8;
  const P=player,live=enemies.filter(e=>!e.dead&&(e.st==='loco'||e.st==='block'||e.st==='atk'||e.st==='edodge'));
  const maxE=maxAtk();
  const sc=e=>Math.abs(e.x-P.x)+Math.random()*170+(e.type==='caut'?90:0)-(e.type==='aggr'?110:0)-(e.type==='boss'?999:0);
  live.forEach(e=>e._s=sc(e));live.sort((a,b)=>a._s-b._s);
  live.forEach((e,i)=>{e.role=i<maxE?'engage':(Math.random()<.5?'circle':'wait')});
  if(maxE===2&&live.length>2&&sgn(live[0].x-P.x)===sgn(live[1].x-P.x)){
    for(let k=2;k<live.length;k++)if(sgn(live[k].x-P.x)!==sgn(live[0].x-P.x)){const r=live[1].role;live[1].role=live[k].role;live[k].role=r;break}
  }
}

function spawn(type,weapon,sideForce){

const WAVES=[['basic','basic'],['aggr','caut'],['basic','aggr','rusher'],['brute','caut','rusher']];
function waves(dt){

const SEP=[];
function separate(){
  SEP.length=0;

  for(let i=0;i<enemies.length;i++){const f=enemies[i];if(!f.dead&&f.st!=='down'&&f.st!=='held'&&f.st!=='thrown')SEP.push(f)}
  for(let i=0;i<SEP.length;i++)for(let j=i+1;j<SEP.length;j++){
    const a=SEP[i],b=SEP[j];if(Math.abs(a.y-b.y)>60)continue;

      const push=md-Math.abs(d),s=d===0?(Math.random()<.5?1:-1):sgn(d);

    }

}

/* ---- level flow ---- */
function spawnGroup(list){list.forEach((d,i)=>spawn(d.t,d.w||null,i%2?1:-1))}
function spawnBus(type,w,x){
  const e=mk('enemy',type,x);e.face=1;e.role='wait';
  if(w){e.weapon=w;e.hp=e.maxhp=Math.round(e.maxhp*1.1)}
  enemies.push(e);return e;
}
function waves2(dt){
  if(state!=='play'||trans)return;
  const alive=enemies.filter(e=>!e.dead).length;waveT-=dt;
  if(area==='out'){
    if(wave<WAVES2.length){
      if(waveT<=0&&(wave===0||alive<=1)){spawnGroup(WAVES2[wave]);wave++;waveT=1.4;if(wave>=2){traffic.on=true;traffic.t=Math.random()*3+3.5}}
    }else if(bus.st==='none'&&alive===0){
      busT-=dt;
      if(busT<=0){bus.st='arriving';bus.x=3400;traffic.on=false;traffic.veh=[];SFX.horn();SFX.engine()}
    }
  }else{
    if(wave<1){
      if(waveT<=0){spawnBus('basic','stick',WL+70);spawnBus('aggr','pipe',WL+150);wave=1;waveT=1}
    }else if(!hasBoss){
      if(waveT<=0&&alive<=1){
        const e=spawnBus('boss',null,WL+60);
        e.variant=2;e.hp=e.maxhp=340;e.poise=e.poiseMax=70;e.scale=1.12;e.hh=114;e.hw=20;e.col='#2e2e2e';e.col2='#202020';
        hasBoss=true;
      }
    }else if(alive===0){endT+=dt;if(endT>3)state='win'}
  }
}
function bossChoose2(e,dist){
  const p2=e.hp<e.maxhp*.5;let pat;
  if(dist>210)pat=Math.random()<.55?['c_dash']:['c_kick'];
  else if(bossMem.light>=3){pat=['c_low','c_cross'];bossMem.light=0}
  else{
    const P=[['c_jab','c_jab','c_hook'],['c_feint','c_jab','c_cross'],['c_kick','c_cross'],['c_low'],['c_feint','c_hook'],['c_jab','c_cross','c_kick'],['c_dash','c_jab']];
    if(p2)P.push(['c_jab','c_cross','c_kick','c_hook'],['c_feint','c_low','c_hook']);
    pat=P[Math.floor(Math.random()*P.length)];
  }
  e.queue=pat.slice(1);startEAtk(e,pat[0]);
}

function menuKey(e){
  const c=e.code;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','Escape','Backspace'].includes(c))e.preventDefault();
  if(trans)return;
  if(screen==='home'){
    if(menu.ctl){if(c==='Escape'||c==='Enter'||c==='Backspace'||c==='KeyJ'||c==='Space'){menu.ctl=false;SFX.step()}return}
    if(c==='ArrowUp'||c==='KeyW'){menu.hsel=(menu.hsel+2)%3;menuTick()}
    else if(c==='ArrowDown'||c==='KeyS'){menu.hsel=(menu.hsel+1)%3;menuTick()}
    else if(c==='Enter'||c==='Space'||c==='KeyJ')homeConfirm();
    else if(c==='KeyM')muted=!muted;
  }else{
    if(c==='ArrowLeft'||c==='KeyA'){if(menu.sel>0){menu.sel--;menuTick()}}

  for(const s of solids){
    if(s.type!=='lamp'||s.broken)continue;
    const lx=s.x+s.w/2+s.arm;if(lx+170<camL||lx-170>camR)continue;
    const fl=(s.fl>0?1-.4*s.fl/.9:1)*K,ly=s.y-6;
    ctx.globalAlpha=fl;ctx.drawImage(cS,lx-150,ly);
    ctx.globalAlpha=.55*fl;ctx.drawImage(gS,lx-64,ly-64);
    ctx.globalAlpha=fl;ctx.drawImage(pS,lx-170,GY-10);
    ctx.fillStyle='#fff';ctx.globalAlpha=.7*fl;
    for(let i=0;i<5;i++){const a=t*2.2+i*1.3+s.x,r=14+i*6;ctx.beginPath();ctx.arc(lx+Math.cos(a)*r,ly+8+Math.sin(a*1.3)*r*.6,1.5,0,6.3);ctx.fill()}
    ctx.globalAlpha=1;
  }
}

function simulate(dt){
  gt+=dt;
  atkNow=0;closeNow=0;for(let i=0;i<enemies.length;i++){const e=enemies[i];if(e.st==='atk')atkNow++;else if(e.aiS==='close'&&!e.dead)closeNow++}
  updatePlayer(player,dt);
  for(let i=0;i<enemies.length;i++)updateEnemy(enemies[i],dt);
  {let w=0;for(let i=0;i<enemies.length;i++){const e=enemies[i];if(!(e.dead&&e.fadeT<=0))enemies[w++]=e}enemies.length=w}
  separate();updateSolids(dt);updateParts(dt);updateDrops(dt);if(level===2){updateTraffic(dt);updateBus(dt)}
  director(dt);if(level===1)waves(dt);else if(level===2)waves2(dt);else waves3(dt);
  if(state==='win'&&!PROG.done[level]){PROG.done[level]=true;saveProg()}
  if(comboT>0){comboT-=dt;if(comboT<=0)breakCombo()}
  bossMem.light=Math.max(0,bossMem.light-dt*.9);
  if(state==='dead')endT+=dt;
}
function reset(){
  paused=false;drops=[];if(level===1)build();else if(level===2)buildL2();else buildL3();parts=[];stains=[];calls=[];feed=[];enemies=[];
  gt=0;hitStop=0;slowT=0;tsc=1;trauma=0;punch=0;flashW=0;vigT=0;
  score=0;combo=0;comboT=0;maxCombo=0;recent=[];lastHurt=-9;state='play';endT=0;wave=0;waveT=.6;bossT=2.4;hasBoss=false;
  bossMem.light=0;bossMem.blocked=0;dirc.t=0;traffic.veh=[];traffic.on=false;traffic.t=4;bus.st='none';bus.x=3400;bus.door=0;busT=2.2;
  for(const k in buf)buf[k]=-9;
  const sx0=level===1?1095:420;player=mk('player','player',sx0);player.face=level===1?-1:1;if(level!==3){player.weapon=null;player.wp=null}
  cam.x=sx0;cam.kx=0;cam.zoom=BASEZ;
}

/* ---------------- camera ---------------- */
function camUpdate(rdt){
  const P=player;let tx=P.x+P.face*60,sx=0,n=0;
  for(const e of enemies){if(e.dead)continue;const d=e.x-P.x;if(Math.abs(d)<650){sx+=d;n++}}
  if(n)tx+=clamp(sx/n*.3,-190,190);
  tx=clamp(tx,P.x-330,P.x+330);
  const half=W/2/cam.zoom;tx=clamp(tx,half,WORLD-half);
  cam.x+=(tx-cam.x)*(1-Math.exp(-5.5*rdt));cam.kx*=Math.exp(-11*rdt);
  punch*=Math.exp(-8*rdt);
  zoomT+=((slowT>0?.03:0)-zoomT)*Math.min(1,rdt*8);
  cam.zoom=BASEZ+punch+zoomT;cam.y=CAMY;
  trauma=Math.max(0,trauma-rdt*1.7);
}

/* ---------------- HUD / render ---------------- */
const TXC=new Map();let TM=null;
function txt(s,x,y,size,align,fill,stroke,lw,weight){
  const key=s+'|'+size+'|'+align+'|'+fill+'|'+(stroke||'')+'|'+(lw||0)+'|'+(weight||'');
  let e=TXC.get(key);
  if(!e){
    if(TXC.size>180)TXC.clear();
    if(!TM)TM=document.createElement('canvas').getContext('2d');
    const f=(weight||'800')+' '+size+'px '+FONT,pad=(stroke?(lw||4):0)+3;
    TM.font=f;const mw=Math.ceil(TM.measureText(s).width),c=document.createElement('canvas');
    c.width=mw+pad*2;c.height=Math.ceil(size*1.4)+pad*2;
    const g=c.getContext('2d'),by=pad+size*1.05;
    g.font=f;g.textAlign='left';g.textBaseline='alphabetic';g.lineJoin='round';
    if(stroke){g.lineWidth=lw||4;g.strokeStyle=stroke;g.strokeText(s,pad,by)}
    g.fillStyle=fill;g.fillText(s,pad,by);
    e={c,ox:align==='center'?pad+mw/2:align==='right'?pad+mw:pad,oy:by};TXC.set(key,e);
  }
  ctx.drawImage(e.c,x-e.ox,y-e.oy);
}
function bar(x,y,w,h,v,max,lag){
  ctx.fillStyle='rgba(0,0,0,.82)';ctx.fillRect(x-3,y-3,w+6,h+6);
  ctx.fillStyle='#4a4a4a';ctx.fillRect(x,y,w*clamp(lag/max,0,1),h);
  ctx.fillStyle='#fafafa';ctx.fillRect(x,y,w*clamp(v/max,0,1),h);
}
let hpLag=180,bossLag=300;
function render(rdt){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const sh=trauma*trauma*24,ox=(Math.random()*2-1)*sh,oy=(Math.random()*2-1)*sh*.7;
  ctx.save();
  ctx.translate(W/2+ox,H/2+oy);ctx.scale(cam.zoom,cam.zoom);ctx.translate(-cam.x-cam.kx,-cam.y);
  ctx.drawImage(BG,0,0);drawEnv();
  const vx0=cam.x+cam.kx-W/2/cam.zoom-140,vx1=cam.x+cam.kx+W/2/cam.zoom+140;
  // stains
  for(const s of stains){ctx.globalAlpha=clamp(s.a,0,1)*.85;ctx.fillStyle='#050505';ctx.beginPath();if(s.wall)ctx.arc(s.x,s.y,s.r,0,6.3);else ctx.ellipse(s.x,s.y,s.r*1.8,s.r*.5,0,0,6.3);ctx.fill()}
  ctx.globalAlpha=1;
  for(let i=0;i<solids.length;i++){const s=solids[i];if(s.x+s.w<vx0||s.x>vx1)continue;drawSolid(s)}
  drawDrops();drawPickupHints();
  for(let i=0;i<enemies.length;i++){const e=enemies[i];if(e.dead&&e.x>vx0&&e.x<vx1)drawChar(e)}
  for(let i=0;i<enemies.length;i++){const e=enemies[i];if(!e.dead&&e.type!=='boss'&&e.x>vx0&&e.x<vx1)drawChar(e)}
  for(let i=0;i<enemies.length;i++){const e=enemies[i];if(!e.dead&&e.type==='boss'&&e.x>vx0&&e.x<vx1)drawChar(e)}
  drawChar(player);
  drawTraffic();
  drawParts();
  // enemy bars
  let tgt=null,bt=-1;
  for(const e of enemies){if(e.dead||e.type==='boss')continue;if(gt-e.lastHit<3&&e.lastHit>bt){bt=e.lastHit;tgt=e}}
  if(!tgt){let bd=170;for(const e of enemies){if(e.dead||e.type==='boss')continue;const d=Math.abs(e.x-player.x);if(d<bd&&sgn(e.x-player.x)===player.face){bd=d;tgt=e}}}
  if(tgt){const x=tgt.x-24,y=tgt.y-tgt.hh-18;ctx.fillStyle='rgba(0,0,0,.85)';ctx.fillRect(x-2,y-2,52,8);ctx.fillStyle='#fafafa';ctx.fillRect(x,y,48*clamp(tgt.hp/tgt.maxhp,0,1),4)}
  ctx.restore();
  // overlays
  ctx.globalAlpha=.55+vigT*.35;ctx.drawImage(VIG,0,0);ctx.globalAlpha=1;
  
  hud(rdt);
}
function hud(rdt){
  // player health
  hpLag+=(player.hp-hpLag)*Math.min(1,rdt*(player.hp<hpLag?1.6:8));
  txt('VEERA',34,40,16,'left','#0a0a0a','#fff',4);
  bar(34,50,300,14,Math.max(0,player.hp),player.maxhp,Math.max(0,hpLag));
  txt('SCORE '+String(score).padStart(5,'0'),34,92,16,'left','#0a0a0a','#fff',4);
  // combo
  if(combo>=2){
    const pop=1+comboPop*.28,x=W/2,y=84;
    ctx.save();ctx.translate(x,y);ctx.scale(pop,pop);ctx.transform(1,0,-.12,1,0,0);
    txt('COMBO',-8,-34,16,'center','#0a0a0a','#fff',4);
    txt(String(combo),0,10,54,'center','#0a0a0a','#fff',7,'900');
    ctx.restore();
    ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(W/2-52,100,104,5);ctx.fillStyle='#fff';ctx.fillRect(W/2-52,100,104*clamp(comboT/2.4,0,1),5);
  }
  // callouts
  const c=calls[calls.length-1];
  if(c){
    const u=c.t/c.life,sc=1+Math.max(0,.25-u*1.2),a=u<.75?1:1-(u-.75)/.25;
    ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.translate(W/2,230);ctx.scale(sc,sc);ctx.transform(1,0,-.15,1,0,0);
    txt(c.s,0,0,c.s.length>8?58:70,'center','#fafafa','#050505',9,'900');ctx.restore();
  }
  // style feed
  let fy=H-34;
  for(let i=feed.length-1,n=0;i>=0&&n<4;i--,n++){const f=feed[i];ctx.globalAlpha=clamp(f.t/.5,0,1);txt(f.s+'  +'+f.pts,34,fy,15,'left','#fafafa','#050505',5);fy-=22}
  ctx.globalAlpha=1;
  // boss bar
  const boss=enemies.find(e=>e.type==='boss'&&!e.dead);
  if(boss){
    bossLag+=(boss.hp-bossLag)*Math.min(1,rdt*2);
    bar(W/2-260,H-52,520,12,boss.hp,boss.maxhp,bossLag);
    ctx.fillStyle='#fafafa';ctx.fillRect(W/2-260,H-36,520*clamp(boss.poise/80,0,1),2);
  }
  // controls (compact, bottom-right, auto-hides)
  if(showCtl&&(ctlT>0||paused)){
    const L=['A / D   move','W   jump','S   crouch','J   light  (J J J combo)','run + J   dash strike','S + J   low sweep','K   heavy','L   dodge  (time it = perfect)','I   block  (tap early = parry)','E   grab  \u2192  J throw / K slam','E   near a chair: kick it','E   near a weapon: pick it up','Q   level select (when paused)','P pause   H hide   R restart   M mute'],lh=17,pw=262,ph=14+L.length*lh,x=W-pw-14,y=H-ph-14;
    ctx.globalAlpha=paused?1:clamp(ctlT/1.2,0,1);
    ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(x,y,pw,ph);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,pw-1,ph-1);
    ctx.font='700 12.5px '+FONT;ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillStyle='#f2f2f2';
    L.forEach((s,i)=>ctx.fillText(s,x+12,y+22+i*lh));ctx.globalAlpha=1;
  }else txt('H  controls',W-18,H-18,13,'right','#fafafa','#000',4);
  if(!document.hasFocus()){txt('CLICK TO FOCUS',W/2,H-84,18,'center','#fafafa','#050505',5)}
  hud2();
  if(paused){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);txt('PAUSED',W/2,H/2,84,'center','#fafafa','#000',8,'900');txt('P / Esc  resume      R  restart      Q  level select',W/2,H/2+44,20,'center','#d8d8d8','#000',4)}
  if(state==='dead'||state==='win'){
    const k=clamp((state==='dead'?endT-.8:endT-.2)/.8,0,1);
    ctx.fillStyle='rgba(0,0,0,'+(.62*k)+')';ctx.fillRect(0,0,W,H);ctx.globalAlpha=k;
    txt(state==='win'?'LEVEL '+level+' CLEARED':'DOWN',W/2,H/2-8,84,'center','#fafafa','#000',8,'900');
    if(state==='win'&&level<6)txt('LEVEL '+(level+1)+' UNLOCKED',W/2,H/2+104,16,'center','#fafafa','#000',4);
    txt('SCORE '+score+'     BEST COMBO '+maxCombo,W/2,H/2+34,22,'center','#e8e8e8','#000',5);
    txt(state==='win'?(level<PLAYABLE?'ENTER  next level      R  replay      Q  level select':'ENTER  level select      R  replay'):'R  retry      Q  level select',W/2,H/2+70,18,'center','#bdbdbd','#000',4);ctx.globalAlpha=1;
  }
}
function tickReal(rdt){
  for(let i=calls.length-1;i>=0;i--){calls[i].t+=rdt;if(calls[i].t>calls[i].life)calls.splice(i,1)}
  for(let i=feed.length-1;i>=0;i--){feed[i].t-=rdt;if(feed[i].t<=0)feed.splice(i,1)}
  titleT=Math.max(0,titleT-rdt);ctlT=Math.max(0,ctlT-rdt);flashW=Math.max(0,flashW-rdt*1.1);vigT=Math.max(0,vigT-rdt*1.4);comboPop=Math.max(0,comboPop-rdt*5);
  for(const e of enemies)if(e.hitJ>0)e.hitJ-=rdt;if(player.hitJ>0)player.hitJ-=rdt;
}

/* ---------------- loop ---------------- */
let last=0;const dts=[.0167,.0167,.0167,.0167];
function frame(now){
  requestAnimationFrame(frame);
  let rdt=Math.min(.05,(now-last)/1000);last=now;if(!(rdt>0))rdt=.016;
  dts.push(rdt);dts.shift();const sm=Math.min(.05,(dts[0]+dts[1]+dts[2]+dts[3])/4);
  if(!paused&&slowT>0)slowT-=rdt;
  tsc+=((slowT>0?.4:1)-tsc)*Math.min(1,rdt*16);
  if(trans)tickTrans(sm);
  if(screen!=='game'){menuFrame(sm);return}
  if(paused||trans){}
  else if(hitStop>0)hitStop-=rdt;
  else{let rem=sm*tsc;while(rem>1e-5){const s=Math.min(rem,1/60);simulate(s);rem-=s}}
  if(!paused){tickReal(sm);camUpdate(sm)}render(rdt);
}
BGs[1]=makeBG();BG=BGs[1];VIG=makeVig();loadProg();reset();enterMenu('home');
window.focus();cv.focus();
window.__veera={holdWaves:()=>{waveT=1e9},PROG,menu,menuKey,enterMenu,unlockAll:()=>{for(let i=1;i<=6;i++)PROG.done[i]=true},add:(t,x)=>{const e=mk('enemy',t,x);enemies.push(e);return e},mk,drawFig,locoPose,updatePose,strideK,ctx,startLevel,bus,traffic,get:()=>({player,enemies,state,wave,score,combo,hasBoss,solids,level,area,drops,trans,screen,paused}),keys,buf,step:(dt)=>simulate(dt),WATK,startAttack,cam,render:()=>render(.016),setGT:v=>{gt=v}};
requestAnimationFrame(frame);
})();
</script>
